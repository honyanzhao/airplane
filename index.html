<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞机大战 · 9×9 双人对战</title>
<style>
  :root{
    --bg:#03110c; --scope:#04140d; --panel:#072019; --ink:#9dffce; --muted:#4f9b78;
    --line:#0e3b2c; --line-2:#15543d;
    --radar:#2bff9e; --radar-dim:#0c5c3a;
    --amber:#ffb000;
    --red:#ff5a5a;
    --cell:rgba(10,38,28,.74); --cell-hi:rgba(43,255,158,.20);
    --miss-bg:rgba(120,160,140,.10); --miss-ink:#5f8f76;
    --fire-bg:rgba(255,138,60,.20); --fire-ink:#ff9a4d; --fire-edge:#ff8a3c;
    --boom-bg:rgba(255,80,80,.22); --boom-ink:#ff6b6b; --boom-edge:#ff5a5a;
    --empty-bg:rgba(255,107,107,.16); --empty-ink:rgba(255,107,107,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; padding:18px 16px 40px;
    font-family:"Cascadia Code","JetBrains Mono","Consolas","SFMono-Regular",ui-monospace,"Microsoft YaHei",monospace;
    background:radial-gradient(120% 90% at 50% -10%, #06231a 0%, var(--bg) 55%) fixed;
    color:var(--ink); letter-spacing:.2px;
  }
  /* CRT 扫描线 + 暗角 */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1500;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; opacity:.5;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1499;
    background:radial-gradient(120% 120% at 50% 40%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  h1{font-size:21px; margin:0 0 6px; letter-spacing:2px; color:var(--radar); font-weight:700; text-shadow:0 0 12px rgba(43,255,158,.35);}
  .radar-ico{display:inline-block; margin-right:6px; color:var(--radar); animation:ping 2.4s ease-in-out infinite;}
  @keyframes ping{0%,100%{opacity:1; text-shadow:0 0 10px var(--radar);}50%{opacity:.55; text-shadow:0 0 2px var(--radar);}}
  h1 .en{font-size:12px; letter-spacing:3px; color:var(--muted); margin-left:8px; font-weight:400;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:16px; letter-spacing:.5px;}
  .sub::before{content:"» "; color:var(--radar);}
  .wrap{max-width:1000px; margin:0 auto;}
  .panel{background:linear-gradient(180deg, rgba(10,40,28,.9), rgba(4,20,13,.92)); border:1px solid var(--line-2); border-radius:4px; padding:16px; box-shadow:inset 0 0 30px rgba(0,0,0,.5), 0 0 0 1px rgba(43,255,158,.05); position:relative;}
  .panel::before{content:""; position:absolute; top:8px; left:8px; width:14px; height:14px; border-top:2px solid var(--radar); border-left:2px solid var(--radar); opacity:.6;}
  .panel::after{content:""; position:absolute; bottom:8px; right:8px; width:14px; height:14px; border-bottom:2px solid var(--radar); border-right:2px solid var(--radar); opacity:.6;}
  .row{display:flex; gap:18px; flex-wrap:wrap;}
  .col{flex:1 1 360px; min-width:320px;}
  .board-title{font-weight:700; letter-spacing:1px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; color:var(--radar); text-transform:uppercase; font-size:13px;}
  .board-title .tag{font-size:11px; color:var(--muted); font-weight:400; letter-spacing:.5px; text-transform:none;}
  .grid{
    display:grid; grid-template-columns:24px repeat(9,34px); grid-template-rows:24px repeat(9,34px);
    gap:3px; padding:10px; border-radius:4px; user-select:none; position:relative; isolation:isolate;
    background:
      radial-gradient(circle at 50% 50%,
        transparent 0 28%, rgba(43,255,158,.06) 28% 29%, transparent 29% 44%,
        rgba(43,255,158,.06) 44% 45%, transparent 45% 62%,
        rgba(43,255,158,.06) 62% 63%, transparent 63%),
      var(--scope);
  }
  /* 雷达扫描（扇形：前缘亮线，向后约 130° 渐隐） */
  .grid::before{
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none; border-radius:4px;
    background:conic-gradient(from 0deg,
      rgba(43,255,158,.85) 0deg,
      rgba(43,255,158,.45) 4deg,
      rgba(43,255,158,.15) 50deg,
      rgba(43,255,158,.04) 100deg,
      rgba(43,255,158,0) 130deg,
      rgba(43,255,158,0) 360deg);
    animation:sweep 5s linear infinite; mix-blend-mode:screen;
  }
  @keyframes sweep{to{transform:rotate(360deg);}}
  .grid > *{z-index:1;}
  /* 己方飞机：战术友军标记（统一雷达绿，机头为指挥节点） */
  .cell.pl-head{background:var(--radar); color:#03110c; font-weight:800; font-size:13px; border:1px solid var(--radar); box-shadow:0 0 10px rgba(43,255,158,.5);}
  .cell.pl-wing,.cell.pl-body,.cell.pl-tail{background:rgba(43,255,158,.14); color:var(--radar); font-size:11px; border:1px solid rgba(43,255,158,.45);}
  /* 放置预览高亮 */
  .cell.preview-ok{outline:2px solid var(--radar); outline-offset:-2px; background:var(--cell-hi);}
  .cell.preview-bad{outline:2px solid var(--red); outline-offset:-2px; background:rgba(255,90,90,.16);}
  .cell{
    background:var(--cell); border:1px solid var(--line); border-radius:3px; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; aspect-ratio:1/1; cursor:pointer; position:relative; color:var(--ink);
    transition:background .12s, box-shadow .12s, color .12s;
  }
  .cell.corner{background:transparent; border:1px solid transparent; cursor:default; color:var(--muted); font-size:12px; font-weight:700;}
  .cell.unknown{background:var(--cell);}
  .cell.clickable:hover{background:var(--cell-hi); box-shadow:inset 0 0 0 1px var(--radar); color:#eafff5;}
  .cell.miss{background:var(--miss-bg); color:var(--miss-ink); border-color:transparent;}
  .cell.fire{background:var(--fire-bg); color:var(--fire-ink); border:1px solid var(--fire-edge);}
  .cell.boom{background:var(--boom-bg); color:var(--boom-ink); border:1px solid var(--boom-edge); box-shadow:0 0 12px rgba(255,90,90,.35);}
  .cell.empty{background:transparent; color:var(--empty-ink); border-color:transparent;}
  .cell.disabled{cursor:default;}
  .setup-dirs{display:flex; gap:8px; align-items:center; margin-top:10px;}
  .dir-btn{width:44px; height:40px; font-size:20px; padding:0; border-radius:3px; background:rgba(43,255,158,.06); color:var(--radar); border:1px solid var(--line-2); transition:all .12s;}
  .dir-btn:hover{background:rgba(43,255,158,.14);}
  .dir-btn.active{background:var(--radar); color:#03110c; box-shadow:0 0 12px rgba(43,255,158,.5);}
  .dir-label{font-size:13px; color:var(--muted); margin-left:6px; letter-spacing:.5px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:8px; letter-spacing:.3px;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:13px; height:13px; border-radius:2px; display:inline-block; border:1px solid rgba(255,255,255,.15);}
  .status{margin:12px 0; padding:10px 14px; background:rgba(4,20,13,.7); border:1px solid var(--line-2); border-left:3px solid var(--radar); border-radius:3px; font-weight:600; color:var(--ink); letter-spacing:.4px;}
  .log{height:160px; overflow:auto; background:rgba(2,12,8,.7); border:1px solid var(--line); border-radius:3px; padding:8px 10px; font-size:12.5px; line-height:1.7; color:var(--ink); letter-spacing:.2px;}
  .log .me{color:var(--radar);} .log .ai{color:var(--amber);} .log .sys{color:var(--muted);}
  .controls{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
  button{
    font-family:inherit; font-size:13px; letter-spacing:1px; padding:9px 18px; border-radius:3px; border:1px solid var(--radar);
    background:rgba(43,255,158,.10); color:var(--radar); cursor:pointer; font-weight:700; text-transform:uppercase; transition:all .12s;
  }
  button:hover:not(:disabled){background:var(--radar); color:#03110c; box-shadow:0 0 14px rgba(43,255,158,.45);}
  button.ghost{background:transparent; color:var(--muted); border-color:var(--line-2);}
  button.ghost:hover:not(:disabled){color:var(--radar); border-color:var(--radar); box-shadow:none; background:rgba(43,255,158,.08);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  select{padding:8px 10px; border-radius:3px; border:1px solid var(--line-2); font-size:13px; font-family:inherit; background:var(--scope); color:var(--ink); letter-spacing:.5px;}
  .overlay{
    position:fixed; inset:0; background:rgba(2,10,7,.86); display:none; align-items:center; justify-content:center; z-index:1100;
    backdrop-filter:blur(2px);
  }
  .overlay.show{display:flex;}
  .result-banner{position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:1200; padding:13px 28px; border-radius:3px; font-size:17px; font-weight:800; letter-spacing:3px; pointer-events:none; text-align:center; max-width:92vw; font-family:inherit; animation:bnr 1.1s steps(2,end) infinite;}
  .result-banner.win{background:rgba(3,17,12,.94); border:1px solid var(--radar); color:var(--radar); box-shadow:0 0 26px rgba(43,255,158,.4);}
  .result-banner.lose{background:rgba(17,3,3,.94); border:1px solid var(--red); color:var(--red); box-shadow:0 0 26px rgba(255,90,90,.4);}
  @keyframes bnr{50%{opacity:.55;}}
  .overlay .box{background:linear-gradient(180deg,#06180f,#03110c); border:1px solid var(--radar); border-radius:4px; padding:30px 36px; text-align:center; max-width:420px; box-shadow:0 0 40px rgba(43,255,158,.2), inset 0 0 30px rgba(0,0,0,.6); position:relative;}
  .overlay .box::before{content:""; position:absolute; top:10px; left:10px; right:10px; bottom:10px; border:1px solid rgba(43,255,158,.18); pointer-events:none;}
  .overlay h2{margin:0 0 12px; color:var(--radar); letter-spacing:4px; font-weight:800; text-shadow:0 0 12px rgba(43,255,158,.4);}
  .overlay p{color:var(--muted); margin:6px 0 20px; line-height:1.6; letter-spacing:.4px;}
  .setup-info{font-size:13px; color:var(--muted); margin:6px 0; letter-spacing:.3px;}
  .badge{display:inline-block; padding:2px 8px; border-radius:3px; font-size:11px; font-weight:700; letter-spacing:1px; background:rgba(43,255,158,.12); color:var(--radar); border:1px solid rgba(43,255,158,.3);}
  .hidden{display:none !important;}
  .score{font-size:14px; font-weight:600; letter-spacing:.5px;}
  .score b{font-size:18px; color:var(--radar);}
  /* 首页 / 规则 — 与游戏页一致的作战室风 */
  .panel.lite{position:relative; background:linear-gradient(180deg, rgba(10,40,28,.5), rgba(4,20,13,.55)); box-shadow:none;}
  .panel.lite::before,.panel.lite::after{display:none;}
  /* 首页两个大选项居中 */
  #home{min-height:62vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px;}
  .help-btn{position:absolute; top:14px; right:14px; width:34px; height:34px; border:1px solid var(--radar); border-radius:50%; background:rgba(43,255,158,.06); color:var(--radar); font-size:17px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 0 10px rgba(43,255,158,.2); transition:all .15s; font-family:inherit;}
  .help-btn:hover{background:rgba(43,255,158,.16); box-shadow:0 0 18px rgba(43,255,158,.4);}
  .mode-stack{display:flex; flex-direction:column; gap:18px; max-width:460px; margin:0 auto;}
  .mode-row{display:flex; flex-direction:column; align-items:center; gap:12px; border:1px solid var(--line-2); border-radius:4px; padding:28px 22px; cursor:pointer; background:rgba(43,255,158,.04); transition:all .15s; width:100%;}
  .mode-row:hover{border-color:var(--radar); background:rgba(43,255,158,.10); box-shadow:0 0 22px rgba(43,255,158,.18);}
  .mode-row .mc-ico{font-size:38px; color:var(--radar); display:block; text-shadow:0 0 14px rgba(43,255,158,.45);}
  .mode-row .mc-title{font-size:24px; font-weight:800; letter-spacing:6px; color:var(--ink); text-align:center;}
  .rules-list{display:flex; flex-direction:column; gap:16px; max-width:640px; margin:8px auto 16px;}
  .rule-item{display:flex; gap:14px; align-items:flex-start;}
  .rule-num{flex:none; width:28px; height:28px; border:1px solid var(--radar); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--radar); font-size:13px; font-weight:800; box-shadow:0 0 10px rgba(43,255,158,.2);}
  .rule-text{font-size:14px; line-height:1.8; color:var(--ink); letter-spacing:.3px;}
  .rule-text b{color:var(--radar);}
  .center-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="radar-ico">◎</span>飞机大战<span class="en">AIR BATTLE GRID</span></h1>

  <!-- 首页 -->
  <section id="home" class="panel lite">
    <button class="help-btn" id="helpBtn" title="帮助">?</button>
    <div class="mode-stack">
      <div class="mode-row" id="pvpCard">
        <span class="mc-ico">⚔</span>
        <div class="mc-title">双人对战</div>
      </div>
      <div class="mode-row" id="pveCard">
        <span class="mc-ico">☣</span>
        <div class="mc-title">人机对战</div>
      </div>
    </div>
  </section>

  <!-- 规则页（帮助） -->
  <section id="rules" class="panel lite hidden">
    <div class="board-title">帮助</div>
    <div class="rules-list">
      <div class="rule-item"><div class="rule-num">1</div><div class="rule-text">每方在 9×9 棋盘（列 A–I、行 1–9）中隐藏 <b>三架飞机</b>，每架 10 格：机头 1 · 机翼 5 · 机身 1 · 机尾 3。</div></div>
      <div class="rule-item"><div class="rule-num">2</div><div class="rule-text">轮流报坐标打击。<b>命中机头 ✸</b> 整架爆炸，此后打其翼/身/尾均记为“空”(×)；<b>命中翼/身/尾 ⊕</b> 中弹；<b>打中水域</b> 炸出坑 ·。</div></div>
      <div class="rule-item"><div class="rule-num">3</div><div class="rule-text">先击落对方 <b>三架飞机</b> 的一方获胜。坐标示例：<b>C4</b> = 第 C 列第 4 行。</div></div>
    </div>
    <div class="setup-info" id="rulesModeHint" style="text-align:center;"></div>
    <div class="center-actions">
      <button class="ghost" id="rulesBackBtn">← 返回</button>
      <button id="rulesStartBtn">开始布置 ▸</button>
    </div>
  </section>

  <!-- 设置区 -->
  <div id="setup" class="panel">
    <div class="board-title">游戏设置 <span class="tag"><span class="badge" id="modeBadge">双人对战</span></span></div>
    <div class="row">
      <div class="col">
        <div id="setupInfo" class="setup-info"></div>
        <div id="setupBoardWrap" class="grid" style="margin-top:10px;"></div>
        <div class="setup-dirs">
          <button class="dir-btn active" data-dir="0" title="机头朝上">↑</button>
          <button class="dir-btn" data-dir="1" title="机头朝右">→</button>
          <button class="dir-btn" data-dir="2" title="机头朝下">↓</button>
          <button class="dir-btn" data-dir="3" title="机头朝左">←</button>
        </div>
        <div class="controls" style="margin-top:10px;">
          <button id="randomBtn" class="ghost">⟳ 随机布阵</button>
          <button id="clearBtn" class="ghost">清空</button>
        </div>
        <div class="setup-info" id="placeHint" style="margin-top:8px;"></div>
        <div class="controls">
          <button id="confirmBtn" disabled>确认布置 →</button>
          <button id="backHomeBtn" class="ghost">← 重选模式</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 对战区 -->
  <div id="battle" class="panel hidden" style="margin-top:16px;">
    <div class="status" id="statusBar">游戏开始</div>
    <div class="row">
      <div class="col">
        <div class="board-title"><span id="ownTitle">我的舰队</span><span class="tag" id="ownTag"></span></div>
        <div id="ownBoard" class="grid"></div>
      </div>
      <div class="col">
        <div class="board-title"><span id="enemyTitle">攻击敌方</span></div>
        <div id="enemyBoard" class="grid"></div>
      </div>
    </div>
    <div class="row" style="margin-top:14px;">
      <div class="col">
        <div class="board-title">战况日志</div>
        <div id="log" class="log"></div>
      </div>
    </div>
    <div class="controls">
      <button id="restartBtn" class="ghost">↺ 重新开始</button>
    </div>
  </div>
</div>

<!-- 交接遮罩 -->
<div id="overlay" class="overlay">
  <div class="box">
    <h2 id="ovTitle">作战部署</h2>
    <p id="ovText"></p>
    <button id="ovBtn">进入作战 ▸</button>
  </div>
</div>

<div id="resultBanner" class="result-banner hidden"></div>

<script>
/* ===================== 基础配置 ===================== */
const SIZE = 9;
const COLS = ['A','B','C','D','E','F','G','H','I'];
// 飞机基准形状（朝上，机头在顶部）。真实连贯飞机：机头紧贴机翼中点（同一列相邻），
// 机身 / 机尾沿主轴向下连续，视觉上是一架完整飞机。旋转后形状为 4×5 互换（10 格无法四向严格对称，此为真飞机必然）。
// 行 0 头 / 行 1 翼(5) / 行 2 身 / 行 3 尾(3)；列 -2..2 翼展。机翼中点局部偏移 = (1,0)。
const BASE_OFFSETS = [
  {dr:0,dc:0,part:'head'},                                   // 头 1（机头在顶部）
  {dr:1,dc:-2,part:'wing'},{dr:1,dc:-1,part:'wing'},         // 翼 5（机头正下方一行，机翼中点与机头同列相邻）
  {dr:1,dc:0,part:'wing'},{dr:1,dc:1,part:'wing'},{dr:1,dc:2,part:'wing'},
  {dr:2,dc:0,part:'body'},                                   // 身 1
  {dr:3,dc:-1,part:'tail'},{dr:3,dc:0,part:'tail'},{dr:3,dc:1,part:'tail'} // 尾 3
];

function planeOffsets(rot){
  // 以机头(0,0)为锚点的相对偏移；旋转后机头仍在 (0,0)
  let offs = BASE_OFFSETS.map(o=>({dr:o.dr, dc:o.dc, part:o.part}));
  for(let k=0;k<rot;k++) offs = offs.map(o=>({dr:o.dc, dc:-o.dr, part:o.part})); // 顺时针 90°
  return offs;
}
function getPlaneCells(rot, hr, hc){
  // odr/odc 保留“旋转前”的原始偏移，用于渲染时识别机身主轴(odc===0)与方向
  const offs = planeOffsets(rot);
  return offs.map((o,i)=>({r:hr+o.dr, c:hc+o.dc, part:o.part, odr:BASE_OFFSETS[i].dr, odc:BASE_OFFSETS[i].dc}));
}
// 机翼中点在“以机头为原点”的局部坐标（基准 (dr:1,dc:0) 旋转 rot 次），用于把鼠标锚定到机翼中点
function wingMidOffset(rot){
  let o = {dr:1, dc:0};
  for(let k=0;k<rot;k++) o = {dr:o.dc, dc:-o.dr}; // 顺时针 90°
  return o;
}
// 以 (wr,wc) 为机翼中点所在格，反推机头后展开整架飞机
function getPlaneCellsAtWing(rot, wr, wc){
  const wm = wingMidOffset(rot);
  return getPlaneCells(rot, wr - wm.dr, wc - wm.dc);
}
function coord(r,c){ return COLS[c] + (r+1); }
function emptyGrid(){ return Array.from({length:SIZE},()=>Array.from({length:SIZE},()=>({plane:null,part:null,hit:false}))); }
function emptyTrack(){ return Array.from({length:SIZE},()=>Array.from({length:SIZE},()=>({state:'unknown'}))); }
function rnd(n){ return Math.floor(Math.random()*n); }

/* ===================== 游戏状态 ===================== */
let mode = 'pvp';
let selectedMode = 'pvp';
let step = 'home';
let players = [];          // [{name, fleet, tracking, planes:[{destroyed,cells}], destroyedCount}]
let turn = 0;              // 当前攻击方（pvp 用）
let gameOver = false;
let pendingOverlay = null; // 交接遮罩后的回调

// 布置阶段
let setupPlayer = 0;
let manualRot = 0;
let placedCount = 0;
let hoverRC = null;

function newPlayer(name){ return {name, fleet:emptyGrid(), tracking:emptyTrack(), planes:[], destroyedCount:0}; }

/* ===================== 布置逻辑 ===================== */
function validPlacement(cells, board){
  for(const cc of cells){
    if(cc.r<0||cc.r>=SIZE||cc.c<0||cc.c>=SIZE) return false;
    if(board[cc.r][cc.c].plane!==null) return false;
  }
  return true;
}
function randomPlace(p){
  // 外层整体重试：9×9 上两架特定位置的飞机可能把空位切割到放不下第三架，
  // 单次放置放弃太早会导致舰队残缺，故整盘重来。
  const MAX_OUTER = 300;
  for(let outer=0; outer<MAX_OUTER; outer++){
    p.fleet = emptyGrid(); p.planes = [];
    let ok = true;
    for(let i=0;i<3;i++){
      let placed = false, inner = 0;
      while(!placed && inner<400){
        inner++;
        const rot = rnd(4);
        // 以机翼中点为随机锚点（留出 2 格边距，保证 5×5 整架在界内）
        const wr = 2 + rnd(SIZE-4), wc = 2 + rnd(SIZE-4);
        const cells = getPlaneCellsAtWing(rot, wr, wc);
        if(validPlacement(cells,p.fleet)){
          const idx = p.planes.length;
          cells.forEach(cc=>{ p.fleet[cc.r][cc.c] = {plane:idx, part:cc.part, hit:false}; });
          p.planes.push({destroyed:false, rot, cells});
          placed = true;
        }
      }
      if(!placed){ ok = false; break; }
    }
    if(ok && p.planes.length===3) return;
  }
  console.warn('randomPlace 兜底：未能在限定次数内完成布置');
}

/* ===================== 打击逻辑 ===================== */
// 攻击方 ai 打击防守方 di 的 (r,c)
function doAttack(ai, di, r, c){
  const attacker = players[ai], defender = players[di];
  const tcell = attacker.tracking[r][c];
  if(tcell.state!=='unknown') return {repeat:true};
  const dcell = defender.fleet[r][c];

  if(dcell.plane===null){ // 水域
    tcell.state='miss';
    dcell.hit=true;
    return {result:'miss', r, c};
  }
  const pIdx = dcell.plane;
  const plane = defender.planes[pIdx];
  if(plane.destroyed){ // 已击落，再打其部件视为“空”
    tcell.state='boom';
    return {result:'empty', r, c};
  }
  if(dcell.part==='head'){ // 情况1：机头爆炸（仅标记机头，整架不自动揭示）
    plane.destroyed=true;
    defender.destroyedCount++;
    attacker.tracking[r][c].state='boom';
    defender.fleet[r][c].hit=true;
    return {result:'head', r, c, plane:pIdx};
  }
  // 情况2：翼/身/尾中弹
  tcell.state='fire';
  dcell.hit=true;
  return {result:'fire', r, c, part:dcell.part};
}

/* ===================== AI（人机模式） ===================== */
function aiChooseTarget(){
  const t = players[1].tracking;
  const cands = [];
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(t[r][c].state==='fire'){
      for(const [dr,dc] of dirs){
        const nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE && t[nr][nc].state==='unknown') cands.push({r:nr,c:nc});
      }
    }
  }
  if(cands.length) return cands[rnd(cands.length)];
  const unk=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(t[r][c].state==='unknown') unk.push({r,c});
  return unk[rnd(unk.length)];
}
function aiMove(){
  if(gameOver) return;
  const tgt = aiChooseTarget();
  const res = doAttack(1,0,tgt.r,tgt.c);
  logAI(res, tgt);
  renderBattle();
  if(players[0].destroyedCount===3){ endGame(1); return; }
  setStatus('轮到你攻击 — 点击右侧敌方棋盘报坐标');
}

/* ===================== 渲染 ===================== */
const $ = id => document.getElementById(id);

function buildGrid(container, onClick, opts={}){
  container.innerHTML='';
  // 角落
  const corner=document.createElement('div'); corner.className='cell corner'; container.appendChild(corner);
  // 列标 A-I
  for(let c=0;c<SIZE;c++){
    const h=document.createElement('div'); h.className='cell corner'; h.textContent=COLS[c]; container.appendChild(h);
  }
  for(let r=0;r<SIZE;r++){
    const rh=document.createElement('div'); rh.className='cell corner'; rh.textContent=(r+1); container.appendChild(rh);
    for(let c=0;c<SIZE;c++){
      const cell=document.createElement('div');
      cell.className='cell'; cell.dataset.r=r; cell.dataset.c=c;
      if(opts.clickable){ cell.classList.add('clickable'); cell.addEventListener('click',()=>onClick(r,c)); }
      if(opts.hoverPreview){ cell.addEventListener('mouseover',()=>onPreview(r,c)); }
      container.appendChild(cell);
    }
  }
  if(opts.hoverPreview){ container.addEventListener('mouseleave', clearPreview); }
}

/* ===================== 飞机格子着色（替代 SVG 渲染） ===================== */
// 把已布置飞机以色块+符号显示在棋盘格上（网格始终可见）
function paintFleet(container, player){
  container.querySelectorAll('.cell[data-r]').forEach(el=>{
    el.classList.remove('pl-head','pl-wing','pl-body','pl-tail');
    el.textContent='';
    const r=+el.dataset.r, c=+el.dataset.c;
    const v=player.fleet[r][c];
    if(v.plane!==null){
      el.classList.add('pl-'+v.part);
      if(v.part==='head') el.textContent='头';
    }
  });
}
// 放置预览：高亮将要落子的格子（机翼中点锚定）
let previewCells=null;
function onPreview(r,c){
  if(placedCount>=3) return;
  hoverRC={r,c};
  const cells=getPlaneCellsAtWing(manualRot, r, c); // (r,c) 为机翼中点所在格
  const valid=validPlacement(cells, players[setupPlayer].fleet);
  previewCells={cells, valid};
  paintPreview();
}
function clearPreview(){
  hoverRC=null; previewCells=null; paintPreview();
}
function paintPreview(){
  const wrap=$('setupBoardWrap');
  wrap.querySelectorAll('.cell[data-r]').forEach(el=> el.classList.remove('preview-ok','preview-bad'));
  if(previewCells){
    const set=new Set(previewCells.cells.map(x=>x.r+','+x.c));
    wrap.querySelectorAll('.cell[data-r]').forEach(el=>{
      const r=+el.dataset.r, c=+el.dataset.c;
      if(set.has(r+','+c)) el.classList.add(previewCells.valid?'preview-ok':'preview-bad');
    });
  }
}

function renderSetup(){
  const wrap = $('setupBoardWrap');
  buildGrid(wrap, (r,c)=>placeManual(r,c), {clickable:true, hoverPreview:true});
  paintFleet(wrap, players[setupPlayer]);
  const ph=$('placeHint'); if(ph) ph.textContent='';
  $('confirmBtn').disabled = placedCount<3;
}

function renderBattle(){
  const cur = (mode==='pve') ? players[0] : players[turn];
  const oppIdx = (mode==='pve') ? 1 : (1-turn);
  const opp = players[oppIdx];

  $('ownTitle').textContent = (mode==='pve')?'我的舰队（你）':'我的舰队 · '+cur.name;
  $('enemyTitle').textContent = (mode==='pve')?'攻击敌方（电脑）':'攻击敌方 · '+opp.name;
  $('ownTag').textContent = `已损失 ${cur.destroyedCount}/3 架`;

  // 自己舰队盘（显示己方飞机 + 受击情况）
  const own = $('ownBoard');
  buildGrid(own, ()=>{}, {});
  own.querySelectorAll('.cell[data-r]').forEach(el=>{
    const r=+el.dataset.r, c=+el.dataset.c; const v=cur.fleet[r][c];
    if(v.plane!==null){
      const plane = cur.planes[v.plane];
      if(plane.destroyed){ el.classList.add('boom'); el.textContent='✸'; }   // 已击落：整架显示残骸
      else if(v.hit){ el.classList.add('fire'); el.textContent='⊕'; }         // 中弹
      else { el.classList.add('pl-'+v.part); if(v.part==='head') el.textContent='头'; } // 完好飞机：格子着色显示
    } else if(v.hit){ el.classList.add('miss'); el.textContent='·'; }
  });

  // 敌方跟踪盘（仅命中/未命中，可点击攻击）
  const en = $('enemyBoard');
  buildGrid(en, (r,c)=>onAttack(r,c), {clickable:true});
  en.querySelectorAll('.cell[data-r]').forEach(el=>{
    const r=+el.dataset.r, c=+el.dataset.c; const s=cur.tracking[r][c].state;
    if(s==='miss'){ el.classList.add('miss'); el.textContent='·'; el.classList.remove('clickable'); }
    else if(s==='fire'){ el.classList.add('fire'); el.textContent='⊕'; el.classList.remove('clickable'); }
    else if(s==='boom'){ el.classList.add('boom'); el.textContent='✸'; el.classList.remove('clickable'); }
    else if(s==='empty'){ el.classList.add('empty'); el.textContent='×'; el.classList.remove('clickable'); }
  });
}

/* ===================== 控制流 ===================== */
function onAttack(r,c){
  if(gameOver) return;
  let res;
  if(mode==='pve'){ res = doAttack(0,1,r,c); }
  else { res = doAttack(turn, 1-turn, r,c); }
  if(res.repeat){ toast('该坐标已打击过'); return; }
  logAttack(res);
  renderBattle();
  // 胜负
  const defenderIdx = (mode==='pve')?1:(1-turn);
  if(players[defenderIdx].destroyedCount===3){
    endGame((mode==='pve')?0:turn);
    return;
  }
  // 切换
  if(mode==='pvp'){
    const nextName = players[1-turn].name;
    showOverlay('轮到 '+nextName, '请将设备交给 '+nextName+'，准备好后点击继续。', ()=>{
      turn = 1-turn; renderBattle(); setStatus('轮到 '+players[turn].name+' 攻击');
    });
  } else {
    setStatus('电脑思考中…');
    setTimeout(aiMove, 650);
  }
}

function endGame(winnerIdx){
  gameOver = true;
  const isWin = (mode==='pve') ? (winnerIdx===0) : true;
  const msg = (mode==='pve')
    ? (winnerIdx===0?'★ 任务达成：三架敌机已全部击落 ★':'✸ 任务失败：我方三架战机被击落 ✸')
    : ('★ 任务达成：'+players[winnerIdx].name+' 击落全部敌机 ★');
  setStatus(msg);
  logSys(msg);
  // 顶部醒目横幅（独立于 overlay，确保任何环境下都能看到结束提示）
  const b=$('resultBanner');
  b.textContent=msg;
  b.className='result-banner '+(isWin?'win':'lose');
  showOverlay('作战结束', msg+' 点击「再战」可重新开始。', null);
  $('ovBtn').textContent='再战 ▸';
}

/* ===================== 日志 ===================== */
function logAttack(res){
  const lg=$('log'); const div=document.createElement('div');
  const who = (mode==='pve')?'<span class="me">你</span>':('<span class="me">'+players[turn].name+'</span>');
  const coordTxt = coord(res.r,res.c);
  let txt='';
  if(res.result==='miss') txt = who+' 打击 '+coordTxt+'：炸出坑 ·（空）。';
  else if(res.result==='fire') txt = who+' 打击 '+coordTxt+'：命中'+partName(res.part)+'，⊕ 中弹！';
  else if(res.result==='head') txt = who+' 打击 '+coordTxt+'：✸ 命中机头，整架飞机爆炸！';
  else if(res.result==='empty') txt = who+' 打击 '+coordTxt+'：该机已毁，此格为空。';
  div.innerHTML = txt; lg.appendChild(div); lg.scrollTop=lg.scrollHeight;
}
function logAI(res,tgt){
  const lg=$('log'); const div=document.createElement('div');
  const coordTxt = coord(tgt.r,tgt.c); let txt='';
  if(res.result==='miss') txt='<span class="ai">电脑</span> 打击 '+coordTxt+'：炸出坑 ·（空）。';
  else if(res.result==='fire') txt='<span class="ai">电脑</span> 打击 '+coordTxt+'：命中'+partName(res.part)+'，⊕ 中弹！';
  else if(res.result==='head') txt='<span class="ai">电脑</span> 打击 '+coordTxt+'：✸ 命中机头，你的飞机爆炸！';
  div.innerHTML=txt; lg.appendChild(div); lg.scrollTop=lg.scrollHeight;
}
function logSys(t){ const lg=$('log'); const d=document.createElement('div'); d.className='sys'; d.textContent=t; lg.appendChild(d); lg.scrollTop=lg.scrollHeight; }
function partName(p){ return p==='head'?'机头':p==='wing'?'机翼':p==='body'?'机身':'机尾'; }
function setStatus(t){ $('statusBar').textContent=t; }
let toastTimer=null;
function toast(t){ setStatus(t); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ if(!gameOver) setStatus(mode==='pve'?'轮到你攻击 — 点击右侧敌方棋盘报坐标':'轮到 '+players[turn].name+' 攻击'); },1400); }

function showOverlay(title,text,cb){
  $('ovTitle').textContent=title; $('ovText').textContent=text;
  pendingOverlay=cb; $('overlay').classList.add('show');
}
$('ovBtn').addEventListener('click',()=>{
  $('overlay').classList.remove('show');
  if(pendingOverlay){ const f=pendingOverlay; pendingOverlay=null; f(); }
});

/* ===================== 布置交互 ===================== */
function placeManual(r,c){
  if(placedCount>=3) return;
  const board = players[setupPlayer].fleet;
  const cells = getPlaneCellsAtWing(manualRot, r, c); // (r,c) 为机翼中点所在格
  if(!validPlacement(cells,board)){ toast('位置非法：越界或与已有飞机重叠'); return; }
  const idx=placedCount;
  cells.forEach(cc=>{ board[cc.r][cc.c]={plane:idx,part:cc.part,hit:false}; });
  players[setupPlayer].planes.push({destroyed:false, rot:manualRot, cells});
  placedCount++;
  renderSetup();
}
function clearSetup(){
  players[setupPlayer].fleet=emptyGrid(); players[setupPlayer].planes=[]; placedCount=0;
  $('confirmBtn').classList.remove('hidden');
  renderSetup();
}
function randomSetup(){
  randomPlace(players[setupPlayer]); placedCount=3;
  renderSetup();
  $('confirmBtn').classList.remove('hidden');
}
function setDir(rot){
  manualRot = rot;
  const dl=$('dirLabel'); if(dl) dl.textContent = '机头方向：' + (rot===0?'上':rot===1?'右':rot===2?'下':'左');
  updateDirButtons();
  if(hoverRC) onPreview(hoverRC.r, hoverRC.c);
}
function updateDirButtons(){
  document.querySelectorAll('.dir-btn').forEach(b=>{
    b.classList.toggle('active', +b.dataset.dir===manualRot);
  });
}
document.querySelectorAll('.dir-btn').forEach(b=>{
  b.addEventListener('click',()=>setDir(+b.dataset.dir));
});
$('randomBtn').addEventListener('click',randomSetup);
$('clearBtn').addEventListener('click',clearSetup);
$('confirmBtn').addEventListener('click',confirmSetup);
$('restartBtn').addEventListener('click',()=>location.reload());

function confirmSetup(){
  if(placedCount<3) return;
  if(mode==='pvp'){
    if(setupPlayer===0){
      showOverlay('Player 1 布置完成', '请将设备交给 Player 2 进行布置。', ()=>{
        setupPlayer=1; placedCount=0; manualRot=0;
        const si2=$('setupInfo'); if(si2) si2.textContent='Player 2';
        setDir(0);
        $('confirmBtn').classList.remove('hidden');
        renderSetup();
      });
    } else {
      startBattle();
    }
  } else {
    // 人机：电脑随机
    players[1]=newPlayer('电脑'); randomPlace(players[1]);
    startBattle();
  }
}

/* ===================== 启动 ===================== */
function startBattle(){
  showStep('battle');
  if(mode==='pvp'){
    turn=0; setStatus('轮到 '+players[0].name+' 攻击');
    logSys('对战开始：Player 1 vs Player 2，三架飞机各就各位。');
  } else {
    setStatus('轮到你攻击 — 点击右侧敌方棋盘报坐标');
    logSys('对战开始：你 vs 电脑。');
  }
  renderBattle();
}

/* ===================== 页面导航 ===================== */
function showStep(name){
  step = name;
  ['home','rules','setup','battle'].forEach(s=>{
    const el=$(s); if(el) el.classList.toggle('hidden', s!==name);
  });
}
function gotoRules(){
  $('rulesModeHint').textContent = selectedMode ? ('已选模式：' + (selectedMode==='pvp'?'双人对战':'人机对战')) : '';
  showStep('rules');
}
function gotoSetup(){
  if(!selectedMode) selectedMode='pvp';
  mode = selectedMode;
  players=[newPlayer('Player 1'), newPlayer('Player 2')];
  setupPlayer=0; placedCount=0; manualRot=0;
  $('modeBadge').textContent = mode==='pvp'?'双人对战':'人机对战';
  const si=$('setupInfo'); if(si) si.textContent = mode==='pvp'?'Player 1':'你的舰队';
  setDir(0);
  $('confirmBtn').classList.remove('hidden');
  renderSetup();
  showStep('setup');
}

// 首页 / 规则页（帮助）导航
$('pvpCard').addEventListener('click', ()=>{ selectedMode='pvp'; gotoSetup(); });
$('pveCard').addEventListener('click', ()=>{ selectedMode='pve'; gotoSetup(); });
$('helpBtn').addEventListener('click', ()=>{ gotoRules(); });
$('rulesBackBtn').addEventListener('click', ()=>{ showStep('home'); });
$('rulesStartBtn').addEventListener('click', ()=>{ gotoSetup(); });
$('backHomeBtn').addEventListener('click', ()=>{ showStep('home'); });

// 初始化：进入首页
showStep('home');
</script>
